name: Build images

on:
  schedule:
  - cron: '0 14 * * 1'
  push:
    paths-ignore:
    - 'docs/**'
    - '**.md'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.builds.name }}
    runs-on: ubuntu-latest
    strategy:
      # Dont cancel entire job if one failed
      fail-fast: false
      matrix:
        builds:
          - name: Debian 11
            codename: debian-11
          - name: Debian 12
            codename: debian-12
          - name: Debian 13
            codename: debian-13
          - name: Debian Testing
            codename: debian-testing
          - name: Alma Linux 8
            codename: almalinux-8
          - name: Alma Linux 9
            codename: almalinux-9
          - name: Alma Linux 10
            codename: almalinux-10
          - name: Rocky Linux 8
            codename: rockylinux-8
          - name: Rocky Linux 9
            codename: rockylinux-9
          - name: Rocky Linux 10
            codename: rockylinux-10
          - name: Ubuntu 24.04
            codename: ubuntu-24_04
          - name: Ubuntu 26.04
            codename: ubuntu-26_04
          - name: Arch Linux
            codename: archlinux
          - name: GitHub Runner
            codename: github-runner
          - name: Windows 2025 Runner
            codename: windows-2025-runner
            windows: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: '1.15.4'

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.56.0'

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install qemu-utils qemu-kvm libarchive-tools xorriso socat mtools dosfstools -y

      - name: Build
        env:
          ALIST_UPLOAD_DOMAIN: ${{ secrets.ALIST_UPLOAD_URL }}
          ALIST_USERNAME: ${{ secrets.ALIST_USERNAME }}
          ALIST_PASSWORD: ${{ secrets.ALIST_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${{ matrix.builds.windows }}" != "true" ]; then
            just build "${{ matrix.builds.codename }}"
            bash .github/scripts/upload-alist.sh "${{ matrix.builds.codename }}.qcow2" "/Local/VirtualMachineImages"
            exit 0
          fi

          # host listener: the guest reports diagnostics over slirp's
          # 10.0.2.2 gateway to :8080. Capture every request (incl. the
          # 'GET /?s=...' status query) to a log in the workspace (a path
          # the runner user can definitely write). 8080 > 1024, no sudo.
          STATUS_LOG="$PWD/guest-status.log"
          touch "$STATUS_LOG"
          (while true; do nc -l 8080 >>"$STATUS_LOG" 2>/dev/null; done) &

          # windows build: run packer in the background and snapshot the
          # guest display every 60s so a failed run still shows which
          # screen the guest was stuck on.
          mkdir -p /tmp/winscreens
          (
            while true; do
              if [ -S windows-2025-runner-monitor.sock ]; then
                printf 'screendump /tmp/winscreens/%s.ppm\n' "$(date +%s)" | sudo socat - UNIX-CONNECT:windows-2025-runner-monitor.sock 2>/dev/null
              fi
              sleep 60
            done
          ) &
          SNAP_PID=$!
          set +e
          just build-windows "${{ matrix.builds.codename }}"
          RC=$?
          kill $SNAP_PID 2>/dev/null
          set -e
          if [ $RC -ne 0 ]; then
            echo '==== guest serial console (COM1) log ===='
            cat windows-2025-runner-serial.log 2>/dev/null || echo 'no serial log'
            echo '==== guest status (host listener on 10.0.2.2:8080) ===='
            grep -oE 'GET /\?s=[^ ]+' guest-status.log 2>/dev/null | sed 's|GET /?s=||' | while read -r l; do python3 -c "import urllib.parse,sys;print(urllib.parse.unquote(sys.argv[1]))" "$l"; done || cat guest-status.log 2>/dev/null
            echo '==== guest status floppy ===='
            sudo mdir -i windows-2025-runner-status.img :: 2>/dev/null
            sudo mtype -i windows-2025-runner-status.img ::STATUS.TXT 2>/dev/null || echo 'no status file'
            # convert the last screendumps to png so they can be inspected
            # (ppm -> png via imagemagick if available)
            mkdir -p windows-screens
            i=0
            for f in $(ls -t /tmp/winscreens/*.ppm 2>/dev/null | head -6); do
              sudo cp "$f" "windows-screens/guest-$i.ppm" 2>/dev/null || cp "$f" "windows-screens/guest-$i.ppm" 2>/dev/null
              i=$((i+1))
            done
            exit $RC
          fi
          bash .github/scripts/upload-alist.sh "${{ matrix.builds.codename }}.qcow2" "/Local/VirtualMachineImages"

      - name: Upload windows guest screenshots on failure
        if: failure() && matrix.builds.windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-runner-screens
          path: windows-screens/
          retention-days: 7
          if-no-files-found: ignore
